<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Λογιστικό Δελτίο</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <div>
        <h1>Λογιστικό Δελτίο</h1>
        <p id="subtitle" class="muted">Φόρτωση…</p>
      </div>
      <div class="actions">
        <label class="field">
          <span>Περίοδος</span>
          <select id="days">
            <option value="1">1 ημέρα</option>
            <option value="2" selected>2 ημέρες</option>
            <option value="7">7 ημέρες</option>
            <option value="14">14 ημέρες</option>
          </select>
        </label>
        <button id="refresh" type="button">Ανανέωση</button>
        <button id="copy" type="button" class="ghost">Αντιγραφή κειμένου</button>
        <a class="btn ghost" href="review.html">Έλεγχος</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="Ενότητες">
      <button id="tab-deadlines" class="tab" role="tab" type="button" aria-selected="true" aria-controls="deadlines-sec">
        ⏰ Προθεσμίες <span id="n-deadlines" class="count">0</span>
      </button>
      <button id="tab-news" class="tab" role="tab" type="button" aria-selected="false" aria-controls="news-sec">
        📰 Άρθρα <span id="n-news" class="count">0</span>
      </button>
    </div>

    <details id="sources-sec" class="sources" hidden>
      <summary id="sources-summary">Πηγές</summary>
      <ul id="sources" class="srclist"></ul>
    </details>

    <div id="filters" class="filters">
      <input id="q" type="search" placeholder="Αναζήτηση (τίτλος, πηγή, θέμα)…" aria-label="Αναζήτηση">
      <div id="srcchips" class="chips" role="group" aria-label="Φίλτρο πηγής"></div>
      <div id="tags" class="chips" role="group" aria-label="Φίλτρο θέματος"></div>
    </div>

    <p id="status" role="status" class="status"></p>

    <section id="deadlines-sec" role="tabpanel" aria-labelledby="tab-deadlines">
      <ol id="deadlines" class="list"></ol>
      <button id="more-deadlines" type="button" class="ghost more" hidden></button>
    </section>

    <section id="news-sec" role="tabpanel" aria-labelledby="tab-news" hidden>
      <ul id="news" class="list"></ul>
    </section>

  </main>

  <footer class="wrap muted">
    Ενημερωτικό δελτίο. Επιβεβαιώστε πάντα στην επίσημη πηγή πριν ενεργήσετε.
  </footer>

  <dialog id="keydlg">
    <form method="dialog">
      <h2>Κλειδί πρόσβασης</h2>
      <p class="muted">Ο διακομιστής απαιτεί κλειδί. Αποθηκεύεται μόνο για αυτή την καρτέλα.</p>
      <input id="keyinput" type="password" autocomplete="off" aria-label="Κλειδί πρόσβασης">
      <div class="dlg-actions">
        <button value="cancel" class="ghost">Άκυρο</button>
        <button value="ok">Σύνδεση</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
